<svg xmlns="http://www.w3.org/2000/svg" width="400" height="148" viewBox="0 0 400 148" role="img" aria-label="Pathfinder — A*, Dijkstra, BFS and DFS with waypoints, mazes and live comparison." font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace">
<title>Pathfinder — A*, Dijkstra, BFS and DFS with waypoints, mazes and live comparison.</title>
<defs>
<clipPath id="card"><rect width="400" height="148" rx="10"/></clipPath>
<linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#34d399" stop-opacity="0"/>
  <stop offset="50%" stop-color="#34d399" stop-opacity="0.07"/>
  <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
</linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#047857"/>
  <stop offset="50%" stop-color="#34d399"/>
  <stop offset="100%" stop-color="#047857"/>
</linearGradient></defs>
<style>
.fade{animation:fade .9s ease-out}
@keyframes fade{from{opacity:0}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.langbar{transform-box:fill-box;transform-origin:left center;animation:grow 1s cubic-bezier(.4,0,.2,1) .25s}
@keyframes grow{from{transform:scaleX(0)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>

<rect x="0.5" y="0.5" width="399" height="147" rx="10" fill="#161b22" stroke="#30363d"/>

<!-- Accent stays emerald on every card; language colour lives in the data bar
     at the foot, where it reads as information rather than decoration. -->
<rect x="0.5" y="0.5" width="399" height="2.5" rx="1" fill="url(#accent)" opacity="0.9"/>

<g class="fade">
  <text x="20" y="30.92" font-size="14" fill="#6ee7b7" font-weight="bold">Pathfinder</text>
  <g><rect x="308.1" y="16" width="71.9" height="16" rx="8" fill="rgba(16,185,129,0.12)" stroke="#047857"/><circle cx="319.1" cy="24" r="3" fill="#34d399" class="pulse"/><text x="350.05" y="26.98" font-size="8.5" fill="#6ee7b7" text-anchor="middle">live demo</text></g>
  <text x="20" y="53.92" font-size="10.5" fill="#8b949e">A*, Dijkstra, BFS and DFS with waypoints, mazes and live</text><text x="20" y="69.92" font-size="10.5" fill="#8b949e">comparison.</text>
  
  <g class="langbar" style="animation-delay:0.25s"><rect x="20" y="86.92" width="341.32" height="4" fill="#3b82f6"/><rect x="361.32" y="86.92" width="18.13" height="4" fill="#a78bfa"/><rect x="379.45" y="86.92" width="0.55" height="4" fill="#fbbf24"/></g>
  <circle cx="23" cy="102.2" r="3" fill="#3b82f6"/><text x="30" y="104.92" font-size="8.5" fill="#6b7280">TypeScript 95%</text><circle cx="116.4" cy="102.2" r="3" fill="#a78bfa"/><text x="123.4" y="104.92" font-size="8.5" fill="#6b7280">CSS 5%</text>
  <text x="380" y="104.92" font-size="8.5" fill="#6b7280" text-anchor="end">pathfinder</text>
</g>

<!-- The band names where the click actually goes. A card with a demo opens the
     demo, because that is what the badge above promises and what a reader
     wants to see first; everything else opens the source. -->
<line x1="0" y1="118" x2="400" y2="118" stroke="#30363d"/>
<g class="fade">
  <text x="200" y="136.6" font-size="10" fill="#34d399" text-anchor="middle" letter-spacing="0.6">open live demo   →</text>
</g>
</svg>
