<svg xmlns="http://www.w3.org/2000/svg" width="400" height="201" viewBox="0 0 400 201" role="img" aria-label="Neuro Racer Lab — Draw a track, train neural-net cars on it, then race the champion." font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace">
<title>Neuro Racer Lab — Draw a track, train neural-net cars on it, then race the champion.</title>
<defs>
<clipPath id="card"><rect width="400" height="201" rx="10"/></clipPath>
<linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#34d399" stop-opacity="0"/>
  <stop offset="50%" stop-color="#34d399" stop-opacity="0.07"/>
  <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
</linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#047857"/>
  <stop offset="50%" stop-color="#34d399"/>
  <stop offset="100%" stop-color="#047857"/>
</linearGradient></defs>
<style>
.fade{animation:fade .9s ease-out}
@keyframes fade{from{opacity:0}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.langbar{transform-box:fill-box;transform-origin:left center;animation:grow 1s cubic-bezier(.4,0,.2,1) .25s}
@keyframes grow{from{transform:scaleX(0)}}

/* Slow diagonal sweep. Parks off the left edge at rest, so a still frame is clean. */
.sweep{animation:sweep 9s ease-in-out infinite}
@keyframes sweep{0%,22%{transform:translateX(0)}70%,100%{transform:translateX(700px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>

<rect x="0.5" y="0.5" width="399" height="200" rx="10" fill="#161b22" stroke="#30363d"/>
<g clip-path="url(#card)"><rect class="sweep" x="-260" y="0" width="180" height="201" fill="url(#sweepGrad)" transform="skewX(-18)"/></g>
<!-- Accent stays emerald on every card; language colour lives in the data bar
     at the foot, where it reads as information rather than decoration. -->
<rect x="0.5" y="0.5" width="399" height="2.5" rx="1" fill="url(#accent)" opacity="0.9"/>

<g class="fade">
  <text x="20" y="32.09" font-size="15.5" fill="#6ee7b7" font-weight="bold">Neuro Racer Lab</text>
  <g><rect x="302.7" y="16" width="77.3" height="18" rx="9" fill="rgba(16,185,129,0.12)" stroke="#047857"/><circle cx="313.7" cy="25" r="3" fill="#34d399" class="pulse"/><text x="347.35" y="28.33" font-size="9.5" fill="#6ee7b7" text-anchor="middle">live demo</text></g>
  <text x="20" y="56.09" font-size="11.5" fill="#8b949e">Draw a track, train neural-net cars on it, then race</text><text x="20" y="74.09" font-size="11.5" fill="#8b949e">the champion.</text>
  <g><rect x="20" y="92.09" width="102" height="22" rx="6" fill="rgba(16,185,129,0.22)" stroke="#10b981"/><text x="71" y="106.69" font-size="10" fill="#a7f3d0" text-anchor="middle">Neuroevolution</text></g><g><rect x="129" y="92.09" width="66" height="22" rx="6" fill="#0d1117" stroke="#30363d"/><text x="162" y="106.69" font-size="10" fill="#34d399" text-anchor="middle">Phaser 3</text></g><g><rect x="202" y="92.09" width="72" height="22" rx="6" fill="#0d1117" stroke="#30363d"/><text x="238" y="106.69" font-size="10" fill="#34d399" text-anchor="middle">Matter.js</text></g>
  <g class="langbar" style="animation-delay:0.25s"><rect x="20" y="134.09" width="297.27" height="5" fill="#3b82f6"/><rect x="317.27" y="134.09" width="42.07" height="5" fill="#fbbf24"/><rect x="359.34" y="134.09" width="17.4" height="5" fill="#a78bfa"/><rect x="376.73" y="134.09" width="3.27" height="5" fill="#fb7185"/></g>
  <circle cx="23" cy="152.05" r="3" fill="#3b82f6"/><text x="30" y="155.09" font-size="9.5" fill="#6b7280">TypeScript 83%</text><circle cx="124.8" cy="152.05" r="3" fill="#fbbf24"/><text x="131.8" y="155.09" font-size="9.5" fill="#6b7280">JavaScript 12%</text><circle cx="226.6" cy="152.05" r="3" fill="#a78bfa"/><text x="233.6" y="155.09" font-size="9.5" fill="#6b7280">CSS 5%</text>
  <text x="380" y="155.09" font-size="9.5" fill="#6b7280" text-anchor="end">neuro-racer-lab</text>
</g>

<!-- The band names where the click actually goes. A card with a demo opens the
     demo, because that is what the badge above promises and what a reader
     wants to see first; everything else opens the source. -->
<line x1="0" y1="169" x2="400" y2="169" stroke="#30363d"/>
<g class="fade">
  <text x="200" y="188.96" font-size="11" fill="#34d399" text-anchor="middle" letter-spacing="0.6">open live demo   →</text>
</g>
</svg>
