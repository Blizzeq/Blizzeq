<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="237" viewBox="0 0 1000 237" role="img" aria-label="GitHub activity" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace">
<title>GitHub activity</title>
<defs></defs>
<style>
.fade{animation:fade .9s ease-out}
@keyframes fade{from{opacity:0}}
.bar{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.4,0,.2,1) .3s}
@keyframes grow{from{transform:scaleX(0)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>

<rect x="0.5" y="0.5" width="999" height="236" rx="10" fill="#161b22" stroke="#30363d"/>
<g class="fade" style="animation-delay:0s">
  <text x="147.5" y="74" font-size="36" fill="#6ee7b7" text-anchor="middle" font-weight="bold">4.9k</text>
  <text x="147.5" y="96" font-size="11" fill="#e6edf3" text-anchor="middle" letter-spacing="0.6">contributions</text>
  <text x="147.5" y="112" font-size="9.5" fill="#6b7280" text-anchor="middle" letter-spacing="0.4">past 12 months · incl. private</text>
</g><g class="fade" style="animation-delay:0.08s">
  <text x="382.5" y="74" font-size="36" fill="#6ee7b7" text-anchor="middle" font-weight="bold">20</text>
  <text x="382.5" y="96" font-size="11" fill="#e6edf3" text-anchor="middle" letter-spacing="0.6">repositories</text>
  <text x="382.5" y="112" font-size="9.5" fill="#6b7280" text-anchor="middle" letter-spacing="0.4">active, past 12 months</text>
</g><g class="fade" style="animation-delay:0.16s">
  <text x="617.5" y="74" font-size="36" fill="#6ee7b7" text-anchor="middle" font-weight="bold">26</text>
  <text x="617.5" y="96" font-size="11" fill="#e6edf3" text-anchor="middle" letter-spacing="0.6">public repositories</text>
  <text x="617.5" y="112" font-size="9.5" fill="#6b7280" text-anchor="middle" letter-spacing="0.4">excluding forks</text>
</g><g class="fade" style="animation-delay:0.24s">
  <text x="852.5" y="74" font-size="36" fill="#6ee7b7" text-anchor="middle" font-weight="bold">5.1</text>
  <text x="852.5" y="96" font-size="11" fill="#e6edf3" text-anchor="middle" letter-spacing="0.6">years</text>
  <text x="852.5" y="112" font-size="9.5" fill="#6b7280" text-anchor="middle" letter-spacing="0.4">on GitHub</text>
</g>
<line x1="30" y1="138" x2="970" y2="138" stroke="#21262d"/>
<g class="fade" style="animation-delay:.22s">
  <text x="500" y="162" font-size="9.5" fill="#6b7280" text-anchor="middle" letter-spacing="2.4">LANGUAGES · ACROSS THE 10 FEATURED REPOSITORIES</text>
  <g class="bar"><rect x="30" y="174" width="734.08" height="9" rx="2" fill="#3b82f6"/><rect x="766.08" y="174" width="162.7" height="9" rx="2" fill="#34d399"/><rect x="930.78" y="174" width="23.13" height="9" rx="2" fill="#a78bfa"/><rect x="955.91" y="174" width="10.7" height="9" rx="2" fill="#fbbf24"/><rect x="968.61" y="174" width="1" height="9" rx="2" fill="#6b7280"/></g>
  <g><circle cx="251.85" cy="209" r="4" fill="#3b82f6"/><text x="262.85" y="213" font-size="10.5" fill="#8b949e">TypeScript 78.3%</text></g><g><circle cx="382.65" cy="209" r="4" fill="#34d399"/><text x="393.65" y="213" font-size="10.5" fill="#8b949e">Python 17.5%</text></g><g><circle cx="488.25" cy="209" r="4" fill="#a78bfa"/><text x="499.25" y="213" font-size="10.5" fill="#8b949e">CSS 2.7%</text></g><g><circle cx="568.65" cy="209" r="4" fill="#fbbf24"/><text x="579.65" y="213" font-size="10.5" fill="#8b949e">JavaScript 1.4%</text></g><g><circle cx="693.15" cy="209" r="4" fill="#6b7280"/><text x="704.15" y="213" font-size="10.5" fill="#8b949e">Other 0.1%</text></g>
</g>
</svg>
