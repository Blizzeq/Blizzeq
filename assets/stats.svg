  <g><circle cx="255" cy="185" r="4" fill="#3b82f6"/><text x="266" y="189" font-size="10.5" fill="#8b949e">TypeScript 78.2%</text></g><g><circle cx="385.8" cy="185" r="4" fill="#34d399"/><text x="396.8" y="189" font-size="10.5" fill="#8b949e">Python 17.6%</text></g><g><circle cx="491.4" cy="185" r="4" fill="#a78bfa"/><text x="502.4" y="189" font-size="10.5" fill="#8b949e">CSS 2.7%</text></g><g><circle cx="571.8" cy="185" r="4" fill="#fbbf24"/><text x="582.8" y="189" font-size="10.5" fill="#8b949e">JavaScript 1.4%</text></g><g><circle cx="696.3" cy="185" r="4" fill="#fb7185"/><text x="707.3" y="189" font-size="10.5" fill="#8b949e">HTML 0.1%</text></g>
