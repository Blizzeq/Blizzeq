<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="208" viewBox="0 0 1000 208" role="img" aria-label="GitHub activity" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace">
<title>GitHub activity</title>
<defs></defs>
<style>
.fade{animation:fade .9s ease-out}
@keyframes fade{from{opacity:0}}
.tick{transform-box:fill-box;transform-origin:center;animation:tick .7s cubic-bezier(.4,0,.2,1)}
@keyframes tick{from{transform:scaleX(0)}}
.bar{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.4,0,.2,1) .3s}
@keyframes grow{from{transform:scaleX(0)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>

<rect x="0.5" y="0.5" width="999" height="207" rx="10" fill="#161b22" stroke="#30363d"/>
<g class="fade" style="animation-delay:0s">
  <text x="147.5" y="76" font-size="36" fill="#6ee7b7" text-anchor="middle" font-weight="bold">4.9k</text>
  <text x="147.5" y="99" font-size="10.5" fill="#8b949e" text-anchor="middle" letter-spacing="0.8">contributions · 12 months</text>
  <rect class="tick" x="131.5" y="110" width="32" height="2" rx="1" fill="#047857" style="animation-delay:0.2s"/>
</g><g class="fade" style="animation-delay:0.08s">
  <text x="382.5" y="76" font-size="36" fill="#6ee7b7" text-anchor="middle" font-weight="bold">19</text>
  <text x="382.5" y="99" font-size="10.5" fill="#8b949e" text-anchor="middle" letter-spacing="0.8">repositories touched</text>
  <rect class="tick" x="366.5" y="110" width="32" height="2" rx="1" fill="#047857" style="animation-delay:0.28s"/>
</g><g class="fade" style="animation-delay:0.16s">
  <text x="617.5" y="76" font-size="36" fill="#6ee7b7" text-anchor="middle" font-weight="bold">26</text>
  <text x="617.5" y="99" font-size="10.5" fill="#8b949e" text-anchor="middle" letter-spacing="0.8">public repositories</text>
  <rect class="tick" x="601.5" y="110" width="32" height="2" rx="1" fill="#047857" style="animation-delay:0.36s"/>
</g><g class="fade" style="animation-delay:0.24s">
  <text x="852.5" y="76" font-size="36" fill="#6ee7b7" text-anchor="middle" font-weight="bold">5.1</text>
  <text x="852.5" y="99" font-size="10.5" fill="#8b949e" text-anchor="middle" letter-spacing="0.8">years on GitHub</text>
  <rect class="tick" x="836.5" y="110" width="32" height="2" rx="1" fill="#047857" style="animation-delay:0.44s"/>
</g>
<g class="fade" style="animation-delay:.22s">
