<svg xmlns="http://www.w3.org/2000/svg" width="640" height="215" viewBox="0 0 640 215" role="img" aria-label="Black-Scholes Simulator — Monte Carlo price paths with fan charts, VaR and expected shortfall." font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace">
<title>Black-Scholes Simulator — Monte Carlo price paths with fan charts, VaR and expected shortfall.</title>
<defs>
<clipPath id="card"><rect width="640" height="215" rx="10"/></clipPath>
<linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#34d399" stop-opacity="0"/>
  <stop offset="50%" stop-color="#34d399" stop-opacity="0.07"/>
  <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
</linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#047857"/>
  <stop offset="50%" stop-color="#34d399"/>
  <stop offset="100%" stop-color="#047857"/>
</linearGradient></defs>
<style>
.fade{animation:fade .9s ease-out}
@keyframes fade{from{opacity:0}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.langbar{transform-box:fill-box;transform-origin:left center;animation:grow 1s cubic-bezier(.4,0,.2,1) .25s}
@keyframes grow{from{transform:scaleX(0)}}

/* Slow diagonal sweep. Parks off the left edge at rest, so a still frame is clean. */
.sweep{animation:sweep 9s ease-in-out infinite}
@keyframes sweep{0%,22%{transform:translateX(0)}70%,100%{transform:translateX(940px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>

<rect x="0.5" y="0.5" width="639" height="214" rx="10" fill="#161b22" stroke="#30363d"/>
<g clip-path="url(#card)"><rect class="sweep" x="-260" y="0" width="180" height="215" fill="url(#sweepGrad)" transform="skewX(-18)"/></g>
<!-- Accent stays emerald on every card; language colour lives in the data bar
     at the foot, where it reads as information rather than decoration. -->
<rect x="0.5" y="0.5" width="639" height="2.5" rx="1" fill="url(#accent)" opacity="0.9"/>

<g class="fade">
  <text x="24" y="38.04" font-size="18" fill="#6ee7b7" font-weight="bold">Black-Scholes Simulator</text>
  <g><rect x="506.8" y="20" width="109.2" height="18" rx="9" fill="#0d1117" stroke="#30363d"/><text x="561.4" y="32.33" font-size="9.5" fill="#8b949e" text-anchor="middle">Python · Desktop</text></g>
  <text x="24" y="64.04" font-size="12" fill="#8b949e">Monte Carlo price paths with fan charts, VaR and expected shortfall.</text>
  <g><rect x="24" y="101.04" width="55.8" height="23" rx="6" fill="rgba(16,185,129,0.22)" stroke="#10b981"/><text x="51.9" y="116.32" font-size="10.5" fill="#a7f3d0" text-anchor="middle">Python</text></g><g><rect x="86.8" y="101.04" width="87.3" height="23" rx="6" fill="#0d1117" stroke="#30363d"/><text x="130.45" y="116.32" font-size="10.5" fill="#34d399" text-anchor="middle">Monte Carlo</text></g><g><rect x="181.1" y="101.04" width="81" height="23" rx="6" fill="#0d1117" stroke="#30363d"/><text x="221.6" y="116.32" font-size="10.5" fill="#34d399" text-anchor="middle">VaR / CVaR</text></g>
  <g class="langbar" style="animation-delay:0.25s"><rect x="24" y="145.04" width="592" height="5" fill="#34d399"/></g>
  <circle cx="27" cy="163" r="3" fill="#34d399"/><text x="34" y="166.04" font-size="9.5" fill="#6b7280">Python 100%</text>
  <text x="616" y="166.04" font-size="9.5" fill="#6b7280" text-anchor="end">black-scholes-viz</text>
</g>

<!-- The band names where the click actually goes. A card with a demo opens the
     demo, because that is what the badge above promises and what a reader
     wants to see first; everything else opens the source. -->
<line x1="0" y1="181" x2="640" y2="181" stroke="#30363d"/>
<g class="fade">
  <text x="320" y="201.96" font-size="11" fill="#8b949e" text-anchor="middle" letter-spacing="0.6">view source   →</text>
</g>
</svg>
