<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="186" viewBox="0 0 1000 186" role="img" aria-label="GridPulse — Live European power prices, cross-border flows and a trading simulator, built on real ENTSO-E market data across 28+ countries." font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace">
<title>GridPulse — Live European power prices, cross-border flows and a trading simulator, built on real ENTSO-E market data across 28+ countries.</title>
<defs>
<clipPath id="card"><rect width="1000" height="186" rx="10"/></clipPath>
<linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#34d399" stop-opacity="0"/>
  <stop offset="50%" stop-color="#34d399" stop-opacity="0.07"/>
  <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
</linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#047857"/>
  <stop offset="50%" stop-color="#34d399"/>
  <stop offset="100%" stop-color="#047857"/>
</linearGradient></defs>
<style>
.fade{animation:fade .9s ease-out}
@keyframes fade{from{opacity:0}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.langbar{transform-box:fill-box;transform-origin:left center;animation:grow 1s cubic-bezier(.4,0,.2,1) .25s}
@keyframes grow{from{transform:scaleX(0)}}

/* Slow diagonal sweep. Parks off the left edge at rest, so a still frame is clean. */
.sweep{animation:sweep 9s ease-in-out infinite}
@keyframes sweep{0%,22%{transform:translateX(0)}70%,100%{transform:translateX(1300px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>

<rect x="0.5" y="0.5" width="999" height="185" rx="10" fill="#161b22" stroke="#30363d"/>
<g clip-path="url(#card)"><rect class="sweep" x="-260" y="0" width="180" height="186" fill="url(#sweepGrad)" transform="skewX(-18)"/></g>
<!-- Accent stays emerald on every card; language colour lives in the data bar
     at the foot, where it reads as information rather than decoration. -->
<rect x="0.5" y="0.5" width="999" height="2.5" rx="1" fill="url(#accent)" opacity="0.9"/>

<g class="fade">
  <text x="28" y="45.16" font-size="22" fill="#6ee7b7" font-weight="bold">GridPulse</text>
  <g><rect x="894.7" y="24" width="77.3" height="18" rx="9" fill="rgba(16,185,129,0.12)" stroke="#047857"/><circle cx="905.7" cy="33" r="3" fill="#34d399" class="pulse"/><text x="939.35" y="36.33" font-size="9.5" fill="#6ee7b7" text-anchor="middle">live demo</text></g>
  <text x="28" y="75.16" font-size="13" fill="#8b949e">Live European power prices, cross-border flows and a trading simulator, built on real ENTSO-E market data across 28+</text><text x="28" y="94.16" font-size="13" fill="#8b949e">countries.</text>
  <g><rect x="28" y="112" width="64.2" height="24" rx="6" fill="rgba(16,185,129,0.14)" stroke="rgba(52,211,153,0.55)"/><text x="60.1" y="127.96" font-size="11" fill="#6ee7b7" text-anchor="middle">Next.js</text></g><g><rect x="99.2" y="112" width="84" height="24" rx="6" fill="#0d1117" stroke="#30363d"/><text x="141.2" y="127.96" font-size="11" fill="#34d399" text-anchor="middle">TypeScript</text></g><g><rect x="190.2" y="112" width="51" height="24" rx="6" fill="#0d1117" stroke="#30363d"/><text x="215.7" y="127.96" font-size="11" fill="#34d399" text-anchor="middle">D3.js</text></g><g><rect x="248.2" y="112" width="70.8" height="24" rx="6" fill="#0d1117" stroke="#30363d"/><text x="283.6" y="127.96" font-size="11" fill="#34d399" text-anchor="middle">Supabase</text></g><g><rect x="326" y="112" width="90.6" height="24" rx="6" fill="#0d1117" stroke="#30363d"/><text x="371.3" y="127.96" font-size="11" fill="#34d399" text-anchor="middle">ENTSO-E API</text></g>
  <g class="langbar" style="animation-delay:0.25s"><rect x="28" y="136" width="909.37" height="5" fill="#3b82f6"/><rect x="937.37" y="136" width="32.62" height="5" fill="#a78bfa"/><rect x="969.99" y="136" width="2.01" height="5" fill="#fbbf24"/></g>
  <text x="28" y="162" font-size="9.5" fill="#6b7280">gridpulse</text>
  <text x="972" y="162" font-size="9.5" fill="#6b7280" text-anchor="end">TypeScript</text>
</g>
</svg>
